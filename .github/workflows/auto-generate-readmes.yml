name: Auto-generate README for Placement folders

on:
  push:
    paths:
      - 'Placement/**'
  pull_request:
    paths:
      - 'Placement/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-readmes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true # so the action can push commits

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run README generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/generate_readmes.py
